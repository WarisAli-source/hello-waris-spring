name: hello spring boot app to docker

on :
    push


jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '21'
                
            - name: Build and Test Application (Maven)
              working-directory: hello-waris-app
              run: ./mvnw -B clean verify 
                
            - name: Upload Test Reports
              uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: hello-waris-app/target/surefire-reports

    docker-build:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK
              run : echo "Setting up JDK 17"

            - name: Build Jar for Docker
              run: mvn clean package -DskipTests  

            - name: Login to Docker Hub
              run: echo "Login Docker Hub"

            - name: Build and Push Docker Image
              run: docker build -t my-spring-boot-app . && docker push my-spring-boot-app

            - name: Run Docker Container
              run: docker run -d -p 8080:8080 my-spring-boot-app                