name: hello spring boot app to docker

on :
    push


jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '21'
            - name: List repo contents
              run: ls -R

            - name: Make mvnw executable
              run: chmod +x ./mvnw

            - name: Build and Test Application (Maven)
              run: ./mvnw -B clean verify
                
            - name: Upload Test Reports
              uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: target/surefire-reports

    docker-build:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '21'

            - name: Make mvnw executable
              run: chmod +x ./mvnw

            - name: Build Jar for Docker
              run: ./mvnw -B clean package -DskipTests

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build and push docker image
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/hello-waris-spring:latest


            - name: Run Docker Container
              run: docker run -d -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/hello-waris-spring